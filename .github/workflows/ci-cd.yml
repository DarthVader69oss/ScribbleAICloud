name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write   # lets the deploy job exchange GitHub's OIDC token for short-lived AWS credentials
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            lambda/requirements.txt
            tests/requirements.txt
      - name: Install (CPU-only PyTorch)
        run: |
          pip install "torch==2.5.1+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r lambda/requirements.txt -r tests/requirements.txt
      - name: Unit tests (handler, S3 loading, DynamoDB logging against moto)
        run: pytest

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
    needs: [test, terraform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the Lambda image
        id: build
        run: |
          SHA=${GITHUB_SHA::7}
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          # --provenance=false: Lambda cannot read the extra attestation manifest buildx adds by default
          docker buildx build --provenance=false --platform linux/amd64 --build-arg GIT_SHA=$SHA \
            -t $IMAGE:$SHA -t $IMAGE:latest --push .
          echo "image=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"

      - name: Roll Lambda to the new image
        run: |
          aws lambda update-function-code --function-name ${{ vars.LAMBDA_FUNCTION }} --image-uri ${{ steps.build.outputs.image }} > /dev/null
          aws lambda wait function-updated --function-name ${{ vars.LAMBDA_FUNCTION }}

      - name: Smoke test the function (loads the models from S3)
        run: |
          aws lambda invoke --function-name ${{ vars.LAMBDA_FUNCTION }} \
            --payload '{"httpMethod":"GET","path":"/health"}' --cli-binary-format raw-in-base64-out out.json > /dev/null
          python3 - <<'PY'
          import json
          r = json.load(open("out.json")); b = json.loads(r["body"])
          print(b)
          assert r["statusCode"] == 200 and b["status"] == "ok" and b["models_loaded"], "health check failed"
          PY

      - name: Publish web files and refresh the EC2 front end
        run: |
          aws s3 sync ui/ s3://${{ vars.S3_BUCKET }}/ui/ --delete
          aws s3 sync deploy/ s3://${{ vars.S3_BUCKET }}/deploy/ --delete
          CMD=$(aws ssm send-command --instance-ids ${{ vars.EC2_INSTANCE_ID }} --document-name AWS-RunShellScript \
                  --parameters 'commands=["/usr/local/bin/refresh-ui.sh"]' --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD" --instance-id ${{ vars.EC2_INSTANCE_ID }}

      - name: End-to-end check through nginx, API Gateway and Lambda
        run: curl -fsS --retry 5 --retry-delay 5 "${{ vars.DEMO_URL }}/api/health"

      - name: Tell the team
        if: always()
        run: |
          aws sns publish --topic-arn ${{ vars.SNS_TOPIC_ARN }} \
            --subject "ScribbleAI deploy ${{ job.status }}: ${GITHUB_SHA::7}" \
            --message "Deploy of ${GITHUB_SHA::7} to main finished with status ${{ job.status }}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
